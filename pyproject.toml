[project]
name = "s1othello"
version = "0.1.0"
description = "Othello benchmark harness for System One decision models (Jev, Clef, Laya, SemIf) vs search engines. Companion to System1Doom."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
s1othello = "s1othello.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s1othello"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
